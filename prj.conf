#enabling non secure GPIOTE driver for nrf91
# Security mode is selected by the nRF9151 board target.



CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# GPIO register backend owns GPIOTE; keep the GPIO driver from claiming its IRQ.
# Nordic GPIO interrupt ownership is configured in boards/*.conf.


#debug 
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4

# 
